<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image</title>
    <style>
        .images{
            max-width: 1320px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(217, 223, 223);
            
        }
        .images img{
            border: 20px solid grey;
            background-color: bisque;
         width: 50vw;  
         height: 50vh;
        }
@media screen and (max-width:576px) {
    .images img{
        width:10vw;
        height: 10vh;
    }

}
@media screen and (min-width:577px) and (max-width:992px) {
    .images img{
        width:20vw;
        height: 20vh;
    }
}
@media screen and (min-width:993px) and (max-width:1240px) {
     .images img{
        width:40vw;
        height: 40vh;
    }
}
    </style>
</head>
<body>
    <div class="images">
        <img src="./images.webp" alt="">
    </div>
</body>
</html>
