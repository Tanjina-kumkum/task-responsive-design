<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Layout</title>
    <style>
.box-container{
    /* border: 1px solid red; */
    max-width: 1320px;
    min-height: 100vh;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    
   /* padding: 10px; */
   gap: 10px;
    
}
.box-1{
    /* width: 100%;
    height: 100%;
    border: 1px solid blue; */
    background-color: aquamarine;
}
 .box-2{
    /* width: 100%; */
    /* height: 200px; */
    /* border: 1px solid green; */
    /* padding: 10px; */
}
.box-2{
    background-color: cornflowerblue;
}
  .box{
    background-color: rgb(206, 91, 91);
   
    height: 200px;
    /* border: 2px solid red; */
    
  }
  .box-4{
    display: grid;
    gap: 10px;
  }
  
 
  .box-3{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    
  }
  @media screen and (max-width: 576px) {
    .box-container, .box-3{
     grid-template-columns: 1fr;  
    }
   
  }

    </style>

</head>
<body>
 <div class="box-container">
    <div class="box-1"></div>
    
    <div class="box-4">
         <div class="box-2"></div>
    <div class="box-3">
        <div class="box"></div>
        <div class="box"></div>
    </div>
    </div>
   
    
 </div>   
</body>
</html>
